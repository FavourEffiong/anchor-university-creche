<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parent Dashboard | Anchor University Creche</title>
    <link rel="stylesheet" href="../../css/index.css">
    <link rel="icon" href="../../images/logo.png">
    <link rel="stylesheet" href="dashboard.css">
</head>
<body>
    <div class="dashboard-container">
        <aside class="dashboard-sidebar">
            <img src="../../images/logo.png" alt="Anchor University Creche Logo">
            <h2>Parent Dashboard</h2>
            <nav>
                <a href="#" onclick="loadSection('children')">View Children</a>
                <a href="#" onclick="loadSection('fees')">View Fees</a>
                <a href="#" onclick="loadSection('pay')">Pay Fees</a>
                <a href="#" onclick="loadSection('payments')">Payment History</a>
                <a href="#" id="profile-link"><i class="fa fa-user"></i> Profile</a>
            </nav>
            <div style="margin-top:1.5rem; display:flex; align-items:center; justify-content:center; width:100%;">
                <button id="notif-bell" style="background:none; border:none; cursor:pointer; position:relative; font-size:1.5rem; color:#fff;">
                    <i class="fa fa-bell"></i>
                    <span class="notif-badge" style="position:absolute;top:0;right:0;background:#d32f2f;color:#fff;border-radius:50%;padding:2px 6px;font-size:0.8rem;display:none;">0</span>
                </button>
            </div>
            <button class="logout-btn" onclick="logout()">Logout</button>
        </aside>
        <main class="dashboard-main">
            <div class="welcome">Welcome, Parent!</div>
            <div id="section"></div>
        </main>
    </div>
    <script>
    function logout() {
        fetch('../../auth/logout.php', { method: 'POST' }).then(() => {
            window.location.href = '/backend/auth/login.html';
        });
    }
    function loadSection(section) {
        const sectionDiv = document.getElementById('section');
        sectionDiv.innerHTML = 'Loading...';
        if (section === 'children') {
            fetch('view_children.php').then(r => r.json()).then(data => {
                if (!data.success) { sectionDiv.innerHTML = data.message; return; }
                sectionDiv.innerHTML = '<h3>Your Children</h3>' + data.children.map(c => `<div>${c.name}</div>`).join('');
            });
        } else if (section === 'fees') {
            fetch('view_fees.php').then(r => r.json()).then(data => {
                if (!data.success) { sectionDiv.innerHTML = data.message; return; }
                sectionDiv.innerHTML = '<h3>Your Fees</h3>' + data.fees.map(f => `<div>${f.child_name}: ₦${f.amount} - ${f.status}</div>`).join('');
            });
        } else if (section === 'pay') {
            fetch('view_fees.php').then(r => r.json()).then(data => {
                if (!data.success) { sectionDiv.innerHTML = data.message; return; }
                sectionDiv.innerHTML = '<h3>Pay Fees</h3>' + data.fees.filter(f => f.status === 'unpaid').map(f => `<form onsubmit="payFee(event,${f.id},${f.amount})"><div>${f.child_name}: ₦${f.amount} <button type=\'submit\'>Pay</button></div></form>`).join('');
            });
        } else if (section === 'payments') {
            fetch('view_payments.php').then(r => r.json()).then(data => {
                if (!data.success) { sectionDiv.innerHTML = data.message; return; }
                sectionDiv.innerHTML = '<h3>Payment History</h3>' + data.payments.map(p => `<div>₦${p.amount} - ${p.status} (${p.payment_date})</div>`).join('');
            });
        }
    }
    function payFee(e, feeId, amount) {
        e.preventDefault();
        fetch('pay_fees.php', {
            method: 'POST',
            body: new URLSearchParams({ fee_id: feeId, amount: amount, method: 'online' })
        }).then(r => r.json()).then(data => {
            alert(data.message);
            loadSection('fees');
        });
    }
    </script>
</body>
</html>
